hitsRefresh:()=>loadHits(),hitsPlay:()=>HITS.length&&P.set(HITS,0),
pp:()=>P.pp(),next:()=>P.next(),prev:()=>P.prev(),
shuf:()=>{P.shuf=!P.shuf;S.set('shuf',P.shuf);updModes()},rep:()=>{P.rep=(P.rep+1)%3;S.set('rep',P.rep);updModes()},

queue:()=>{$('#qm').classList.toggle('on');rq()},clrq:()=>P.clear(),

document.addEventListener('input',e=>{const x=e.target;if(x.id==='fseek'){seeking=1;P.seek(x.value)}else if(x.id==='vol'){P.vol=+x.value;if(P.a)P.a.volume=P.vol;S.set('vol',P.vol)}else if(x.dataset.b!==undefined){EQV[+x.dataset.b]=+x.value;eqApply()}else if(x.id==='q'){clearTimeout(dt);dt=setTimeout(doSearch,450)}});
document.addEventListener('change',e=>{const x=e.target;if(x.id==='fseek')seeking=0;else if(x.id==='ytkey')S.set('ytkey',x.value.trim());else if(x.id==='langSel'){S.set('lang',x.value);applyLang()}
 else if(x.id==='sleepSel'){clearTimeout(slTm);slT=+x.value;if(slT)slTm=setTimeout(()=>{P.a?.pause();toast(t('sleepOn'))},slT*6e4)}
 else if(x.dataset.k){enabled=$$('#srcBox input:checked').map(i=>i.dataset.k);S.set('src2',enabled);if(!enabled.includes(activeSrc))activeSrc='all';chips()}});

/* ---------- hits: random YouTube music, new on every launch ---------- */
const HQ={uk:['українські хіти','українська музика новинки','ukrainian pop','українські пісні','ukrainian rock','українська поп музика 2025'],es:['éxitos 2025','música latina éxitos','reggaeton éxitos','pop español','éxitos españoles','bachata éxitos','latin pop'],en:['pop hits','rock hits','dance hits','hip hop hits','electronic music','indie pop','lofi beats','jazz classics','80s hits','90s hits','2000s hits','r&b hits','chill music','house music','soul classics','country hits','k-pop hits','metal hits']};
let HITS=[],hq=0;const pick=a=>a[Math.random()*a.length|0];
async function loadHits(){const id=++hq,g=$('#homeHits'),other=lang==='uk'?'es':'uk',last=S.get('lastq',[]);
 const rnd=a=>{const f=a.filter(x=>!last.includes(x));return pick(f.length?f:a)};
 const qs=[...new Set([rnd(HQ[lang]||HQ.uk),rnd(HQ.en),rnd([...HQ.en,...HQ[other]])])];S.set('lastq',qs);
 g.innerHTML=`<small>${t('loading')}</small>`;
 const rs=await Promise.allSettled(qs.map(q=>SRC.youtube.s(q)));if(id!==hq)return;
 const seen=new Set(),l=rs.flatMap(r=>r.value||[]).filter(x=>x&&x.yt&&!seen.has(x.yt)&&seen.add(x.yt)&&(!x.dur||x.dur<900));
 for(let i=l.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[l[i],l[j]]=[l[j],l[i]]}
 HITS=l.slice(0,30);LST.hits=HITS;
 g.innerHTML=HITS.length?HITS.map((x,i)=>`<div class="hit" data-l="hits" data-i="${i}" data-a="play"><img src="${esc(x.cover||PH)}" alt="" loading="lazy"><b>${esc(x.title)}</b><small>${esc(x.artist||'')}</small></div>`).join(''):`<small>${t('noRes')}</small><p><small>${t('netHint')}</small></p>`}
/* ---------- init ---------- */
(async()=>{
 $('#nav').innerHTML=['home','search','radio','lib','set'].map(k=>`<button data-go="${k}">${ICO[k]}<span data-t="${k}"></span></button>`).join('');
 $$('[data-i]').forEach(e=>e.innerHTML=ICO[e.dataset.i]);
 $$('.ppb').forEach(e=>e.innerHTML=`<span class="pl">${ICO.play}</span><span class="pa">${ICO.pause}</span>`);
 $('#vol').value=P.vol;updModes();
 await DB.init();FAV=new Set((await DB.all('fav')).map(x=>x.id));
 (await DB.all('hist')).sort((a,b)=>b.playedAt-a.playedAt).slice(60).forEach(x=>DB.del('hist',x.id));
 const s=S.get('lang','auto');lang=s==='auto'?detect():s;reg=S.get('reg',null)||(lang==='es'?'es':'ua');
 const sq0=S.get('q',null);if(sq0?.q?.length){P.q=sq0.q;P.i=Math.max(0,P.q.findIndex(x=>x.id===sq0.c));ui(P.q[P.i])}
 applyLang();loadRadio();loadHits();
 jf('https://api.invidious.io/instances.json?sort_by=type,users',6000).then(l=>l.filter(i=>i[1].api&&i[1].cors&&i[1].type==='https').slice(0,8).forEach(i=>INV.includes(i[1].uri)||INV.push(i[1].uri))).catch(()=>{});
 jf('https://piped-instances.kavin.rocks/',6000).then(l=>l.slice(0,8).forEach(i=>i.api_url&&!PIPED.includes(i.api_url)&&PIPED.push(i.api_url))).catch(()=>{});
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
